# Test configuration for integration tests with Testcontainers
# This overrides the main application.properties for test environment

# Database configuration for PostgreSQL (used by Testcontainers)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate settings for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Disable H2 console for tests
spring.h2.console.enabled=false

# Application name
spring.application.name=AOD-TEST

# Disable Docker Compose for tests
spring.docker.compose.enabled=false

# Flyway는 테스트에서 비활성 (스키마는 ddl-auto=create-drop이 관리)
spring.flyway.enabled=false

# Cache settings for tests
spring.cache.type=simple

# Logging configuration for tests
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.springframework.test=INFO

# Disable unnecessary features in test environment
openai.api.key=test-key
recommendation.traditional.max-items-per-category=5
recommendation.llm.max-tokens=100

# Disable CommandLineRunner for tests
spring.main.lazy-initialization=false

# 추천 로그 적재 스레드는 테스트에서 끈다 — 통합 테스트가 LogWriter.flushNow() 로 결정적으로 쓴다
rec.log.writer.enabled=false

# 추천 라우터는 테스트에서 절대 부르지 않는다 — 실수로 불려도 즉시 실패하도록 버려진 주소로 고정
rec.router.base-url=http://127.0.0.1:9
rec.backend-version=it